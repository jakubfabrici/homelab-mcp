[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homelab-mcp"
version = "0.1.0"
description = "MCP server exposing a Proxmox homelab, Home Assistant and ESPHome over an authenticated HTTPS endpoint"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "mcp>=1.9,<2",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "starlette>=0.37",
    "asyncssh>=2.14",
    "websockets>=12.0",
    "PyYAML>=6.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
homelab-mcp = "homelab_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/homelab_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
