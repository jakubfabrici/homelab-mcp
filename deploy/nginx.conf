# Reverse-proxy snippet for mcp.fabrici.xyz -> homelab-mcp.
# Use alongside your existing ha.fabrici.xyz vhost. TLS via certbot / your CA.
#
# MCP streamable-HTTP keeps long-lived responses, so disable buffering and
# allow long read timeouts.

server {
    listen 443 ssl http2;
    server_name mcp.fabrici.xyz;

    # ssl_certificate     /etc/letsencrypt/live/mcp.fabrici.xyz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mcp.fabrici.xyz/privkey.pem;

    # Optional: only your own networks may even reach it (defence in depth;
    # the app also enforces the bearer token).
    # allow 192.168.0.0/16;
    # allow 10.0.0.0/8;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:8787;   # the homelab-mcp container:port
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        chunked_transfer_encoding on;
    }
}
